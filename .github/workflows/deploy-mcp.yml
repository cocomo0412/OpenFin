name: OpenFin MCP pipeline

on:
  push:
    branches: [main]
    # Markdown changes do not change the Worker bundle.
    paths: ['mcp/**', '!mcp/**/*.md', 'docs/opentax/korea-tax-ontology-2026.json', '.github/workflows/deploy-mcp.yml']
  pull_request:
    branches: [main]
    paths: ['mcp/**', '!mcp/**/*.md', 'docs/opentax/korea-tax-ontology-2026.json', '.github/workflows/deploy-mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openfin-mcp-pipeline-${{ github.ref }}
  # Never interrupt a production upload already in progress.
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Determine whether Worker inputs changed
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == 'push' ]]; then
            # The first push has no previous tree; deploy conservatively.
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo 'deploy=true' >> "$GITHUB_OUTPUT"
            else
              git rev-parse --verify "${BEFORE_SHA}^{commit}" >/dev/null
              changed=$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- mcp ':(exclude,glob)mcp/**/*.md' docs/opentax/korea-tax-ontology-2026.json)
              if [[ -n "$changed" ]]; then
                echo 'deploy=true' >> "$GITHUB_OUTPUT"
              else
                echo 'deploy=false' >> "$GITHUB_OUTPUT"
              fi
            fi
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build:free
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/free-catalog.test.mjs
      - run: node --test tests/deploy-free.test.mjs
      - run: node --test tests/deploy-scope.test.mjs
      - name: Validate production bundle without deploying
        run: npx wrangler deploy --config wrangler.free.jsonc --dry-run

  deploy:
    # Cloudflare native Git builds must be disconnected before enabling this job.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.scope.outputs.deploy == 'true'
    needs: [validate, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - name: Require the production deployment credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the scoped CLOUDFLARE_API_TOKEN repository secret before deploying.'
            exit 1
          fi
      - name: Refuse deployment if main has newer MCP inputs
        run: |
          git fetch --no-tags --depth=1 origin refs/heads/main
          latest="$(git rev-parse FETCH_HEAD)"
          node scripts/verify-deploy-scope.mjs "$GITHUB_SHA" "$latest"
      - name: Build the production upload bundle
        run: npx wrangler deploy --config wrangler.free.jsonc --dry-run --outfile "$RUNNER_TEMP/openfin-upload.bundle"
      - name: Deploy to the existing Worker without changing routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ac086a8cc9083647e67db51e8310f34b
        run: node scripts/deploy-free.mjs "$RUNNER_TEMP/openfin-upload.bundle"
      - name: Check the deployed MCP with the official SDK
        env:
          MCP_URL: https://openfin.cocomo0412.workers.dev/mcp
        run: |
          for attempt in 1 2 3 4 5; do
            if node scripts/smoke-free.mjs; then
              echo '### Live MCP verification passed' >> "$GITHUB_STEP_SUMMARY"
              echo 'Initialization, tools, search, fetch, source checksum and input guards passed.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          echo '### Live MCP verification failed' >> "$GITHUB_STEP_SUMMARY"
          exit 1
