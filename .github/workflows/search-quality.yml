name: OpenFin search quality

on:
  push:
    branches: [main]
    paths: ['docs/opentax/app.js', 'tests/knowledge/ui-source-evidence.test.mjs', 'tests/knowledge/legacy-source-url.test.mjs', 'tests/knowledge/workflow-input-security.test.mjs', '.github/workflows/staging-openfin.yml', '.github/workflows/release-openfin.yml', 'docs/app.js', 'docs/api-data.js', 'docs/api-data.html', 'docs/api-data.css', 'tests/knowledge/api-data-ui.test.mjs', 'mcp/src/free-catalog.ts', 'mcp/src/free-catalog.json', 'mcp/tests/free-search.test.mjs', 'mcp/tests/free-catalog.test.mjs', 'tests/knowledge/ui-search*.test.mjs', '.github/workflows/search-quality.yml']
  pull_request:
    branches: [main]
    paths: ['docs/opentax/app.js', 'tests/knowledge/ui-source-evidence.test.mjs', 'tests/knowledge/legacy-source-url.test.mjs', 'tests/knowledge/workflow-input-security.test.mjs', '.github/workflows/staging-openfin.yml', '.github/workflows/release-openfin.yml', 'docs/app.js', 'docs/api-data.js', 'docs/api-data.html', 'docs/api-data.css', 'tests/knowledge/api-data-ui.test.mjs', 'mcp/src/free-catalog.ts', 'mcp/src/free-catalog.json', 'mcp/tests/free-search.test.mjs', 'mcp/tests/free-catalog.test.mjs', 'tests/knowledge/ui-search*.test.mjs', '.github/workflows/search-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Check explorer syntax
        run: |
          node --check docs/opentax/app.js
          node --check docs/app.js
          node --check docs/api-data.js
      - name: Check search behavior and input recovery
        run: node --experimental-strip-types --test mcp/tests/free-search.test.mjs mcp/tests/free-catalog.test.mjs tests/knowledge/ui-search-input.test.mjs tests/knowledge/ui-search-contract.test.mjs tests/knowledge/api-data-ui.test.mjs tests/knowledge/ui-source-evidence.test.mjs tests/knowledge/legacy-source-url.test.mjs tests/knowledge/workflow-input-security.test.mjs
