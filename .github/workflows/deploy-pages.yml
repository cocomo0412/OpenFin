name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy direct production deployment
        run: |
          echo 'Legacy direct Pages deployment is disabled. Current Pages publication uses main /docs. Push reviewed website changes to main; do not run the disabled full-edition release.' >&2
          exit 1
