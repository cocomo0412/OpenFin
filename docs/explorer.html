      <a href="./index.html#top">홈</a>
      <a href="./index.html#exports">자료 현황</a>
      <a href="./index.html#mcp">MCP</a>
      <a href="./explorer.html" aria-current="page">정보 검색</a>
    </nav>
  </header>

  <main class="explorer-main">
    <section class="explorer-head section" aria-labelledby="explorer-title">
      <h1 id="explorer-title"><span class="explorer-title-icon" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" focusable="false"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg></span><span>정보 검색</span></h1>
      <p class="explorer-sub">
        필요한 세금·지원금·금융상품 정보를 찾고, 기준일과 출처를 함께 확인하세요.
      </p>
      <div class="explorer-context">
        <span>전체 자료 <strong data-total-items-plain>확인 중</strong>건</span>
        <a href="./api-data.html">공식 API 수집 자료 별도로 보기 <span aria-hidden="true">→</span></a>
      </div>
      <div hidden><span data-version></span><span data-basis-date></span></div>
    </section>

    <section class="section explorer-shell" aria-label="자료 검색">
      <div class="explorer-toolbar">
        <label class="search-field">
          <span>어떤 정보를 찾으세요?</span>
          <input type="search" data-search placeholder="예: 월세, 청년, 신용대출" aria-describedby="search-hint">
        </label>
        <label class="type-field">
          <span>자료 유형</span>
          <select data-type-filter aria-label="자료 유형">
            <option value="">모든 자료 유형</option>
          </select>
        </label>
      </div>
      <p class="search-hint" id="search-hint">검색어를 입력하면 결과가 바뀝니다. 분야를 선택해 범위를 좁힐 수 있습니다.</p>
      <div class="domain-tabs" data-domain-tabs role="group" aria-label="검색 분야"></div>
      <div class="explorer-grid">
        <aside class="result-list" id="search-results" aria-label="검색 결과" tabindex="-1">
          <div class="result-summary" data-result-summary role="status" aria-live="polite" aria-atomic="true">검색할 자료를 준비하고 있습니다.</div>
          <div data-results></div>
          <button class="load-more" type="button" data-load-more hidden>결과 더 보기</button>
        </aside>
        <article class="detail-panel" data-detail-panel id="search-detail" tabindex="-1" aria-label="선택한 자료 상세">
          <p class="empty-state">검색 결과에서 자료를 선택하면 내용과 기준일, 공식 출처를 확인할 수 있습니다.</p>
        </article>
      </div>
    </section>
  </main>
