<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenFin | 공식 API 수집 자료</title><link rel="stylesheet" href="./styles.css">

<main class="api-main"><p class="eyebrow">OFFICIAL API DATA</p><h1>공식 API 수집 자료</h1><p>공식 API가 제공한 자료를 검색하고 원문 필드를 확인합니다. 건수·체크섬·기준일을 검사한 수집본이며, 상품별 조건 검토나 추천 적합성 검증을 완료했다는 의미는 아닙니다.</p>
